# Production deploy for lastaar.com. Every push to main builds the image and
# publishes it to GHCR. The VPS pulls it on its own — a systemd timer runs
# deploy/nextaar-deploy.sh every 2 minutes — so nothing here connects to the
# server. The last job waits until lastaar.com/healthz reports this commit, so
# the run is green only once the new build is actually live.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          # GHCR image names must be lowercase (repo is iminiaki/Nextaar).
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # The VPS is x86-64 (pre-v2 CPU — see the sharp pin in DEPLOY.md).
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:main
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          # NEXT_PUBLIC_* are inlined into the client bundle, so the production
          # origin has to be fixed at build time.
          build-args: |
            NEXT_PUBLIC_SERVER_URL=https://lastaar.com
            NEXT_PUBLIC_SITE_URL=https://lastaar.com
            GIT_SHA=${{ steps.meta.outputs.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-live:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for lastaar.com to serve this build
        env:
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          # Server polls every 2 min, pulls, and health-checks for up to 3 min
          # before it switches or rolls back. 15 min leaves room for a slow
          # evening link to Iran; failed requests here are just retried.
          deadline=$(( $(date +%s) + 900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body=$(curl -s --max-time 20 https://lastaar.com/healthz || true)
            echo "$(date -u +%T) ${body:-<no response>}"
            if echo "$body" | grep -q "\"sha\":\"$SHA\""; then
              echo "Live: $SHA"
              exit 0
            fi
            sleep 20
          done
          echo "::error::lastaar.com did not report $SHA within 15 min. On the server: journalctl -u nextaar-deploy -n 50"
          exit 1
